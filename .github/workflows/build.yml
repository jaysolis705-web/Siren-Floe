
name: Build SirenFlow AI (Mac & Windows)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install customtkinter requests pyinstaller

      - name: Compile Mac App
        run: |
          pyinstaller --noconsole --onedir --windowed --name "SirenFlowAI" sirenflow_ai.py

      - name: Zip Mac App
        run: |
          cd dist
          zip -r SirenFlowAI-macOS.zip SirenFlowAI.app

      - name: Upload Mac App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SirenFlowAI-macOS
          path: dist/SirenFlowAI-macOS.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install customtkinter requests pyinstaller

      - name: Compile Windows EXE
        run: |
          pyinstaller --noconsole --onefile --name "SirenFlowAI" sirenflow_ai.py

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SirenFlowAI-Windows
          path: dist/SirenFlowAI.exe
