name: Build SirenFlow (Windows & Mac)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter requests pillow pyinstaller darkdetect packaging

      - name: Find Target Script and Compile Windows EXE
        shell: bash
        run: |
          # Awtomatikong hahanapin kung sirenflow_studio.py o sirenflow_app.py
          TARGET_SCRIPT=$(ls sirenflow*.py | head -n 1)
          if [ -z "$TARGET_SCRIPT" ]; then
            TARGET_SCRIPT="sirenflow_studio.py"
          fi
          echo "Compiling target script: $TARGET_SCRIPT"
          pyinstaller --noconsole --onefile --collect-all customtkinter --name "SirenFlow-Windows" "$TARGET_SCRIPT"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SirenFlow-Windows
          path: dist/SirenFlow-Windows.exe

  build-mac:
    name: Build macOS App
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python with Tkinter Support
        run: |
          brew install python-tk@3.11 || true

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter requests pillow pyinstaller darkdetect packaging

      - name: Find Target Script and Compile macOS App
        shell: bash
        run: |
          TARGET_SCRIPT=$(ls sirenflow*.py | head -n 1)
          if [ -z "$TARGET_SCRIPT" ]; then
            TARGET_SCRIPT="sirenflow_studio.py"
          fi
          echo "Compiling target script: $TARGET_SCRIPT"
          pyinstaller --windowed --onefile --collect-all customtkinter --name "SirenFlow-Mac" "$TARGET_SCRIPT"
          cd dist
          zip -r SirenFlow-MacOS.zip SirenFlow-Mac.app || zip -r SirenFlow-MacOS.zip SirenFlow-Mac

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SirenFlow-MacOS
          path: dist/SirenFlow-MacOS.zip
