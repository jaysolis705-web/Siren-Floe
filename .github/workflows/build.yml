name: Build SirenFlow Multi-Platform Artifacts

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build Desktop Artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: SirenFlow-Windows.exe
            build_cmd: pyinstaller --onefile --noconsole --name SirenFlow_Windows sirenflow_studio.py
            output_path: dist/SirenFlow_Windows.exe
          - os: macos-latest
            artifact_name: SirenFlow-MacOS.zip
            build_cmd: |
              pyinstaller --onefile --windowed --name SirenFlow_Mac sirenflow_studio.py
              cd dist && zip -r SirenFlow-MacOS.zip SirenFlow_Mac.app
            output_path: dist/SirenFlow-MacOS.zip
          - os: ubuntu-latest
            artifact_name: SirenFlow-Linux.bin
            build_cmd: pyinstaller --onefile --name SirenFlow_Linux sirenflow_studio.py
            output_path: dist/SirenFlow_Linux

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install customtkinter requests pillow pyinstaller

      - name: Build Executable
        run: ${{ matrix.build_cmd }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.output_path }}

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build PWA to APK (TWA Bubblewrap)
        run: |
          npm install -g @bubblewrap/cli
          # Script para mag-generate ng standalone APK mula sa web host
          echo "Building Android wrapper..."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SirenFlow-Android.apk
          path: output/*.apk
