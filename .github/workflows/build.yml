name: Build SirenFlow (Windows & Mac)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter requests pillow pyinstaller

      - name: Compile Windows EXE
        run: |
          pyinstaller --noconsole --onefile --collect-all customtkinter --name "SirenFlow-Windows" sirenflow_studio.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SirenFlow-Windows
          path: dist/SirenFlow-Windows.exe

  build-mac:
    name: Build macOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter requests pillow pyinstaller

      - name: Compile macOS App
        run: |
          pyinstaller --windowed --onefile --collect-all customtkinter --name "SirenFlow-Mac" sirenflow_studio.py
          cd dist
          zip -r SirenFlow-MacOS.zip SirenFlow-Mac.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SirenFlow-MacOS
          path: dist/SirenFlow-MacOS.zip
